name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests (fake model, no API keys needed)
        run: python tests/test_pipeline.py

  docker:
    name: Docker build + smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: creatoros:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start container and check the dashboard answers
        run: |
          docker run -d --name creatoros -p 8787:8787 creatoros:ci
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8787/api/status > status.json; then break; fi
            sleep 2
          done
          cat status.json
          curl -fs http://localhost:8787/ | grep -q "CreatorOS"
          docker inspect --format '{{.State.Health.Status}}' creatoros || true
          test "$(docker exec creatoros whoami)" = "creator"   # runs as non-root
          docker exec creatoros ffmpeg -version | head -1
      - name: Container logs
        if: always()
        run: docker logs creatoros || true
      - name: Image size
        run: docker image ls creatoros:ci
