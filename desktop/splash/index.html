<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CreatorOS</title>
<style>
  :root { --ink:#111; --paper:#fff8e7; --yellow:#ffd23f; --pink:#ff6b9d; --lime:#b8ff5c; --red:#ff5252; --blue:#4dc9ff; }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; overflow:hidden; }
  body { display:flex; align-items:center; justify-content:center; background:var(--paper); color:var(--ink);
         font:16px/1.5 "Segoe UI", system-ui, sans-serif;
         background-image: radial-gradient(var(--ink) 1px, transparent 1px); background-size: 22px 22px;
         animation: dots 1.2s ease-out both; }
  @keyframes dots { from { background-size: 4px 4px; opacity:.4 } to { background-size: 22px 22px; opacity:1 } }

  .stage { text-align:center; width:min(520px, 92vw); transition: transform .55s cubic-bezier(.6,-0.3,.7,1), opacity .5s; }
  .stage.leave { transform: scale(1.35) translateY(-20px); opacity:0; }

  /* ---------- logo ---------- */
  svg.logo { width:min(200px, 26vh); height:min(200px, 26vh); overflow:visible; }
  .shadow { transform-origin: 550px 550px; animation: shadowIn .45s .15s cubic-bezier(.2,.8,.3,1.2) both; }
  .tile   { transform-origin: 474px 474px; animation: drop .7s cubic-bezier(.3,1.6,.5,1) both; }
  @keyframes shadowIn { from { transform: scale(.4); opacity:0 } to { transform: scale(1); opacity:1 } }
  @keyframes drop { 0% { transform: translateY(-700px) rotate(-14deg) } 70% { transform: translateY(18px) rotate(2deg) }
                    100% { transform: translateY(0) rotate(0) } }
  .c { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw .8s .7s cubic-bezier(.65,0,.35,1) forwards; }
  @keyframes draw { to { stroke-dashoffset: 0 } }
  .spark { transform-origin: 690px 474px; transform: scale(0); animation: pop .45s 1.45s cubic-bezier(.3,1.8,.5,1) forwards; }
  @keyframes pop { 0% { transform: scale(0) } 100% { transform: scale(1) } }
  .glint { opacity:0; animation: glint .6s 1.85s ease-out forwards; }
  @keyframes glint { 0% { opacity:0 } 40% { opacity:1; transform: scale(1.6) } 100% { opacity:1; transform: scale(1) } }
  .rays line { stroke:var(--ink); stroke-width:16; stroke-linecap:round; opacity:0;
               transform-origin: 690px 474px; animation: rays .5s 1.65s ease-out forwards; }
  @keyframes rays { 0% { opacity:0; transform: scale(.6) } 50% { opacity:1 } 100% { opacity:0; transform: scale(1.5) } }
  .logo-wrap { display:inline-block; animation: wiggle .5s 2.25s ease-in-out; }
  @keyframes wiggle { 0%,100% { transform: rotate(0) } 30% { transform: rotate(-4deg) } 65% { transform: rotate(3deg) } }

  /* ---------- wordmark ---------- */
  h1 { font:900 clamp(30px, 6vh, 46px) "Arial Black", system-ui, sans-serif; margin:2vh 0 6px; letter-spacing:-1px;
       min-height:1.3em; }
  h1 .l { display:inline-block; opacity:0; transform: translateY(-40px); animation: letter .35s cubic-bezier(.3,1.7,.5,1) forwards; }
  @keyframes letter { to { opacity:1; transform: translateY(0) } }
  h1 .os { display:inline-block; color:#fff; background:var(--pink); border:4px solid var(--ink); box-shadow:5px 5px 0 var(--ink);
           padding:0 10px; margin-left:8px; transform: scale(2.4) rotate(-12deg); opacity:0;
           animation: stamp .4s 2.55s cubic-bezier(.3,1.5,.5,1) forwards; }
  @keyframes stamp { to { transform: scale(1) rotate(-4deg); opacity:1 } }
  .tag { font-weight:700; opacity:0; animation: fade .5s 2.9s forwards; }
  @keyframes fade { to { opacity:1 } }

  /* ---------- loading ---------- */
  .loading { opacity:0; animation: fade .4s 3.1s forwards; }
  .bar { height:18px; border:3px solid var(--ink); box-shadow:4px 4px 0 var(--ink); margin:22px auto 12px; width:80%; overflow:hidden; background:#fff; }
  .bar div { height:100%; width:30%; background: repeating-linear-gradient(45deg, var(--yellow) 0 12px, #ffe27a 12px 24px);
             border-right:3px solid var(--ink); animation: slide 1.1s ease-in-out infinite alternate; }
  @keyframes slide { from { margin-left:0 } to { margin-left:70% } }
  .msg { font-weight:700; min-height:24px; }
  .hint { font-size:13px; color:#555; margin-top:6px; }
  .err { background:var(--red); color:#fff; border:3px solid var(--ink); box-shadow:5px 5px 0 var(--ink); padding:12px;
         margin:18px auto 0; width:90%; display:none; text-align:left; font-size:14px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01s !important; animation-delay: 0s !important; transition: none !important; }
  }
</style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="logo-wrap">
      <svg class="logo" viewBox="0 0 1024 1024" aria-label="CreatorOS logo">
        <rect class="shadow" x="150" y="150" width="800" height="800" rx="150" fill="#111"/>
        <g class="tile">
          <rect x="96" y="96" width="756" height="756" rx="128" fill="#ffd23f" stroke="#111" stroke-width="44"/>
          <path class="c" pathLength="1" d="M 586.5 592.4 A 177 177 0 1 1 586.5 355.6" fill="none" stroke="#111"
                stroke-width="118" stroke-linecap="round"/>
          <g class="rays">
            <line x1="690" y1="350" x2="690" y2="310"/><line x1="800" y1="400" x2="830" y2="370"/>
            <line x1="815" y1="500" x2="855" y2="505"/><line x1="580" y1="400" x2="550" y2="370"/>
          </g>
          <g class="spark">
            <circle cx="706" cy="490" r="74" fill="#111"/>
            <circle cx="690" cy="474" r="63" fill="#ff6b9d" stroke="#111" stroke-width="22"/>
            <circle class="glint" cx="657" cy="441" r="20" fill="#fff" style="transform-origin:657px 441px"/>
          </g>
        </g>
      </svg>
    </div>
    <h1 id="word"><span class="os">OS</span></h1>
    <div class="loading">
      <div class="bar"><div></div></div>
      <div class="msg" id="msg">Starting the CreatorOS engine…</div>
      <div class="hint">The first start can take up to a minute.</div>
    </div>
    <div class="err" id="err">
      The engine didn't start. Quit CreatorOS from the tray icon and open it again.<br>
      If port 8787 is used by another program, close it first. Logs: your app-data folder → <b>CreatorOS/logs</b>.
    </div>
  </div>
<script>
  // Wordmark: "Creator" letters drop in one by one before the "OS" stamp.
  const word = document.getElementById("word"), os = word.querySelector(".os");
  [..."Creator"].forEach((ch, i) => {
    const s = document.createElement("span");
    s.className = "l"; s.textContent = ch; s.style.animationDelay = (1.9 + i * 0.07) + "s";
    word.insertBefore(s, os);
  });

  const URL = "http://127.0.0.1:8787";
  const INTRO_MS = matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 3300; // let the intro finish
  const started = Date.now();
  const steps = ["Starting the CreatorOS engine…", "Loading your workspace…", "Waking up the agents…", "Almost there…"];
  let i = 0;
  setInterval(() => { document.getElementById("msg").textContent = steps[Math.min(++i, steps.length - 1)]; }, 6000);

  function enter() {
    document.getElementById("stage").classList.add("leave");
    setTimeout(() => location.replace(URL), 520);
  }
  async function check() {
    try {
      await fetch(URL + "/api/status", { mode: "no-cors", cache: "no-store" });
      setTimeout(enter, Math.max(0, INTRO_MS - (Date.now() - started)));
      return;
    } catch (e) { /* not ready yet */ }
    if (Date.now() - started > 120000) document.getElementById("err").style.display = "block";
    setTimeout(check, 1000);
  }
  check();
</script>
</body>
</html>
