name: Desktop app

# Builds the CreatorOS desktop app (Tauri) for Windows, macOS and Linux and attaches the
# installers to the GitHub Release of the version tag (e.g. v0.6.0), so every app version
# matches a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Create or find the release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    outputs:
      id: ${{ steps.rel.outputs.result }}
    steps:
      - id: rel
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            try {
              const r = await github.rest.repos.getReleaseByTag({ ...context.repo, tag });
              return String(r.data.id);
            } catch (e) {
              const r = await github.rest.repos.createRelease({
                ...context.repo, tag_name: tag, name: `CreatorOS ${tag}`,
                body: [
                  `## Download CreatorOS ${tag}`,
                  '',
                  '| Your computer | File |',
                  '|---|---|',
                  '| Windows | `CreatorOS_*_x64-setup.exe` (or the `.msi`) |',
                  '| macOS (Apple Silicon) | `CreatorOS_*_aarch64.dmg` |',
                  '| Linux | `.AppImage`, `.deb` or `.rpm` |',
                  '',
                  'Docker: `docker pull ghcr.io/' + context.repo.owner + '/creatoros:' + tag.replace(/^v/, '') + '`',
                  '',
                  'The app is not code-signed yet: Windows SmartScreen may say "Windows protected your PC" → More info → Run anyway; on macOS right-click the app → Open.',
                  '',
                  'See CHANGELOG.md for what\'s new.',
                ].join('\n'),
              });
              return String(r.data.id);
            }

  build:
    name: Build (${{ matrix.name }})
    needs: [release]
    if: always() && (needs.release.result == 'success' || needs.release.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS (Apple Silicon)
            os: macos-latest
          - name: Linux
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Linux system libraries for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Package the Python engine (PyInstaller)
        run: |
          pip install -r requirements.txt pyinstaller
          python desktop/engine/build_engine.py

      - name: Smoke-test the packaged engine
        run: |
          ENGINE=$(ls desktop/src-tauri/binaries/creatoros-engine-*)
          export CREATOROS_HOME="$RUNNER_TEMP/creatoros-home" CREATOROS_PORT=8799
          "$ENGINE" &
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:8799/api/status && break; sleep 2; done
          curl -fs http://127.0.0.1:8799/api/status
          curl -fs -X POST http://127.0.0.1:8799/api/shutdown || true

      - name: Set app version from the tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node -e "const f='desktop/src-tauri/tauri.conf.json';const c=require('./'+f);c.version='$VERSION';require('fs').writeFileSync(f, JSON.stringify(c,null,2))"

      - name: Install Tauri CLI
        working-directory: desktop
        run: npm install

      - name: Build the app and upload installers to the release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tauriScript: npx tauri
          releaseId: ${{ needs.release.outputs.id }}

      - name: Keep installers as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: CreatorOS-${{ runner.os }}
          path: |
            desktop/src-tauri/target/release/bundle/**/*.exe
            desktop/src-tauri/target/release/bundle/**/*.msi
            desktop/src-tauri/target/release/bundle/**/*.dmg
            desktop/src-tauri/target/release/bundle/**/*.AppImage
            desktop/src-tauri/target/release/bundle/**/*.deb
            desktop/src-tauri/target/release/bundle/**/*.rpm
          if-no-files-found: warn
